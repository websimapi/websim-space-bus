<html>
<head>
  <meta charset="utf-8">
  <title>Space Bus</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
    #passenger-list {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      font-family: Arial, sans-serif;
    }
    #passenger-list h3 {
      margin: 0 0 10px 0;
      color: #88ccff;
    }
    #passengers {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #passengers li {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #passengers img {
      border: 2px solid #88ccff;
    }
    #viewToggle {
      font-family: Arial, sans-serif;
      transition: background-color 0.3s;
    }
    #viewToggle:hover {
      background-color: #66aadd !important;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
